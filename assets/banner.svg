<svg width="1200" height="320" viewBox="0 0 1200 320" xmlns="http://www.w3.org/2000/svg" font-family="Segoe UI, Helvetica, Arial, sans-serif">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%" stop-color="#0f2027"/>
      <stop offset="50%" stop-color="#203a43"/>
      <stop offset="100%" stop-color="#2c5364"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#1baf7a"/>
      <stop offset="100%" stop-color="#eda100"/>
    </linearGradient>
    <linearGradient id="shine" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0%" stop-color="#ffffff" stop-opacity="0"/>
      <stop offset="50%" stop-color="#ffffff" stop-opacity="0.18"/>
      <stop offset="100%" stop-color="#ffffff" stop-opacity="0"/>
    </linearGradient>
    <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
      <feGaussianBlur stdDeviation="4" result="b"/>
      <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
    </filter>
  </defs>

  <rect width="1200" height="320" fill="url(#bg)"/>
  <g stroke="#3a5a68" stroke-width="1" opacity="0.25">
    <line x1="0" y1="80" x2="1200" y2="80"/>
    <line x1="0" y1="160" x2="1200" y2="160"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
  </g>

  <!-- PESTEL hexagon node motif -->
  <g filter="url(#glow)">
    <!-- connecting lines drawn in -->
    <g stroke="#5f8ba0" stroke-width="1.5" opacity="0.5" fill="none">
      <polyline points="880,120 990,120 1100,120 1100,215 990,215 880,215 880,120"
        stroke-dasharray="640" stroke-dashoffset="640">
        <animate attributeName="stroke-dashoffset" from="640" to="0" begin="0.9s" dur="1.4s" fill="freeze"/>
      </polyline>
      <line x1="880" y1="120" x2="1100" y2="215" stroke-dasharray="260" stroke-dashoffset="260">
        <animate attributeName="stroke-dashoffset" from="260" to="0" begin="1.4s" dur="1.1s" fill="freeze"/>
      </line>
      <line x1="1100" y1="120" x2="880" y2="215" stroke-dasharray="260" stroke-dashoffset="260">
        <animate attributeName="stroke-dashoffset" from="260" to="0" begin="1.6s" dur="1.1s" fill="freeze"/>
      </line>
    </g>

    <!-- 6 factor nodes: P E S T E L -->
    <g font-size="24" font-weight="700" fill="#ffffff" text-anchor="middle">
      <g>
        <circle cx="880" cy="120" r="0" fill="#2a78d6">
          <animate attributeName="r" values="0;30;27" begin="0.2s" dur="0.6s" fill="freeze"/>
          <animate attributeName="opacity" values="0.75;1;0.75" begin="1.6s" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <text x="880" y="129" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.5s" dur="0.4s" fill="freeze"/>P</text>
      </g>
      <g>
        <circle cx="990" cy="120" r="0" fill="#eda100">
          <animate attributeName="r" values="0;30;27" begin="0.32s" dur="0.6s" fill="freeze"/>
          <animate attributeName="opacity" values="0.75;1;0.75" begin="1.9s" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <text x="990" y="129" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.62s" dur="0.4s" fill="freeze"/>E</text>
      </g>
      <g>
        <circle cx="1100" cy="120" r="0" fill="#e87ba4">
          <animate attributeName="r" values="0;30;27" begin="0.44s" dur="0.6s" fill="freeze"/>
          <animate attributeName="opacity" values="0.75;1;0.75" begin="2.2s" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <text x="1100" y="129" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.74s" dur="0.4s" fill="freeze"/>S</text>
      </g>
      <g>
        <circle cx="880" cy="215" r="0" fill="#4a3aa7">
          <animate attributeName="r" values="0;30;27" begin="0.56s" dur="0.6s" fill="freeze"/>
          <animate attributeName="opacity" values="0.75;1;0.75" begin="2.5s" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <text x="880" y="224" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.86s" dur="0.4s" fill="freeze"/>T</text>
      </g>
      <g>
        <circle cx="990" cy="215" r="0" fill="#1baf7a">
          <animate attributeName="r" values="0;30;27" begin="0.68s" dur="0.6s" fill="freeze"/>
          <animate attributeName="opacity" values="0.75;1;0.75" begin="2.8s" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <text x="990" y="224" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="0.98s" dur="0.4s" fill="freeze"/>E</text>
      </g>
      <g>
        <circle cx="1100" cy="215" r="0" fill="#e34948">
          <animate attributeName="r" values="0;30;27" begin="0.8s" dur="0.6s" fill="freeze"/>
          <animate attributeName="opacity" values="0.75;1;0.75" begin="3.1s" dur="2.6s" repeatCount="indefinite"/>
        </circle>
        <text x="1100" y="224" opacity="0"><animate attributeName="opacity" from="0" to="1" begin="1.1s" dur="0.4s" fill="freeze"/>L</text>
      </g>
    </g>
  </g>

  <rect x="70" y="96" width="8" height="128" rx="4" fill="url(#accent)"/>
  <text x="105" y="128" font-size="44" font-weight="700" fill="#ffffff">PESTEL Analysis</text>
  <text x="105" y="172" font-size="22" font-weight="400" fill="#a8e0c8">India's Ethanol Blending Programme — a data-driven case study</text>

  <g font-size="16" font-weight="600">
    <rect x="105" y="200" width="130" height="34" rx="17" fill="#1baf7a" opacity="0.9"/>
    <text x="170" y="223" fill="#0b0b0b" text-anchor="middle">6 Factors</text>
    <rect x="247" y="200" width="180" height="34" rx="17" fill="#ffffff" opacity="0.12"/>
    <text x="337" y="223" fill="#cfeefc" text-anchor="middle">Ethanol Blending</text>
    <rect x="439" y="200" width="180" height="34" rx="17" fill="#ffffff" opacity="0.12"/>
    <text x="529" y="223" fill="#cfeefc" text-anchor="middle">Policy + Data</text>
  </g>

  <text x="105" y="285" font-size="15" fill="#7fa9bd">Excel · Correlation Analysis · Data Visualization   |   Heta Chavda — Data Analytics Portfolio</text>

  <rect x="-260" y="0" width="260" height="320" fill="url(#shine)" transform="skewX(-20)">
    <animate attributeName="x" from="-260" to="1300" dur="4.5s" begin="1.6s" repeatCount="indefinite"/>
  </rect>
</svg>
